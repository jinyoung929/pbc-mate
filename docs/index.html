a.tl-label:hover b, a.tl-label:focus-visible b { color: var(--orange-dark); }

// ---- files.js
const __m_files = (() => {

// 첨부 파일 내용을 브라우저 IndexedDB에 저장한다 (localStorage는 용량이 작아 파일에 맞지 않는다).
// 이 브라우저에만 남고 다른 사람·기기와 공유되지 않는다. 막힌 환경에서는 Promise가 실패한다.

const DB_NAME = 'pbc-mate-files';
const STORE = 'files';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function run(mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const result = fn(tx.objectStore(STORE));
    tx.oncomplete = () => { db.close(); resolve(result?.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
    tx.onabort = () => { db.close(); reject(tx.error); };
  });
}

const putFile = (id, blob) => run('readwrite', (s) => s.put(blob, id));
const getFile = (id) => run('readonly', (s) => s.get(id));
const deleteFile = (id) => run('readwrite', (s) => s.delete(id));
const clearFiles = () => run('readwrite', (s) => s.clear());

return { putFile, getFile, deleteFile, clearFiles };
})();

// ---- lib/dates.js
const __m_lib_dates = (() => {

// 날짜는 모두 'YYYY-MM-DD' 문자열로 다룬다. 시간대 영향을 없애려고 UTC 자정으로 계산한다.

const DAY_MS = 24 * 60 * 60 * 1000;
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

function toUTC(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function fromUTC(ms) {
  return new Date(ms).toISOString().slice(0, 10);
}

/** from → to 까지 며칠인지. to가 더 이르면 음수. */
function daysBetween(from, to) {
  return Math.round((toUTC(to) - toUTC(from)) / DAY_MS);
}

function addDays(iso, days) {
  return fromUTC(toUTC(iso) + days * DAY_MS);
}

/** '2026-10-02' → '10/2' */
function formatMD(iso) {
  const [, m, d] = iso.split('-').map(Number);
  return `${m}/${d}`;
}

/** '2026-10-01' → '10월 1일 (목)' */
function formatKoreanDay(iso) {
  const [, m, d] = iso.split('-').map(Number);
  return `${m}월 ${d}일 (${WEEKDAYS[new Date(toUTC(iso)).getUTCDay()]})`;
}

/** '2026-10-02' → '10/2 (금)' */
function formatMDW(iso) {
  return `${formatMD(iso)} (${WEEKDAYS[new Date(toUTC(iso)).getUTCDay()]})`;
}

/** 기기 시간 기준 오늘 날짜 */
function todayISO(now = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
}

return { daysBetween, addDays, formatMD, formatKoreanDay, formatMDW, todayISO };
})();

// ---- lib/add.js
const __m_lib_add = (() => {
const { daysBetween } = __m_lib_dates;

// 저장은 store.js의 addItems가 하고, 여기서는 검증·변환만 한다.


/**
 * 날짜 문자열 → 'YYYY-MM-DD'. 못 읽으면 null.
 * 허용: 2026-09-30 · 2026.9.30 · 2026. 9. 30. · 2026/9/30 · 9/30 (연도는 baseDate 기준)
 */
function normalizeDate(input, baseDate) {
  const s = String(input ?? '').trim().replace(/\s+/g, '').replace(/\.$/, '');
  if (!s) return null;
  let y; let m; let d;
  let full = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/.exec(s);
  if (full) [, y, m, d] = full.map(Number);
  else if ((full = /^(\d{1,2})[/.](\d{1,2})$/.exec(s))) {
    [, m, d] = full.map(Number);
    y = Number(baseDate.slice(0, 4));
  } else return null;

  const date = new Date(Date.UTC(y, m - 1, d));
  const valid = date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
  if (!valid) return null;
  const p = (n) => String(n).padStart(2, '0');
  return `${y}-${p(m)}-${p(d)}`;
}

/** 담당자 표시 이름: '김민지' + '대리' → '김민지 대리' */
function ownerName(name, title) {
  return [name, title].map((v) => String(v ?? '').trim()).filter(Boolean).join(' ');
}

/**
 * 한 건 입력값 검증.
 * fields: { name, ownerName, ownerTitle?, dept?, requestedOn, neededOn, procedure? }
 * 새 요청 자료는 항상 '미회신'으로 시작한다. 이후 상태는 상태 변경 기능으로 바꾼다.
 * @returns {{ errors: Record<string,string>, value: object | null }}
 */
function validateItem(fields, baseDate) {
  const errors = {};
  const name = String(fields.name ?? '').trim();
  const owner = ownerName(fields.ownerName, fields.ownerTitle);
  const requestedOn = normalizeDate(fields.requestedOn, baseDate);
  const neededOn = normalizeDate(fields.neededOn, baseDate);

  if (!name) errors.name = '자료명을 입력해 주세요.';
  if (!String(fields.ownerName ?? '').trim()) errors.ownerName = '담당자 이름을 입력해 주세요.';
  if (!String(fields.requestedOn ?? '').trim()) errors.requestedOn = '요청일을 입력해 주세요.';
  else if (!requestedOn) errors.requestedOn = '날짜 형식을 확인해 주세요. 예: 2026-09-30';
  if (!String(fields.neededOn ?? '').trim()) errors.neededOn = '필요일을 입력해 주세요.';
  else if (!neededOn) errors.neededOn = '날짜 형식을 확인해 주세요. 예: 2026-10-07';

  if (Object.keys(errors).length) return { errors, value: null };

  const procedure = String(fields.procedure ?? '').trim();
  const dept = String(fields.dept ?? '').trim();
  return {
    errors,
    value: {
      item: { name, owner, requestedOn, neededOn, status: 'none', ...(procedure && { procedure }), nudges: [] },
      person: { owner, dept },
    },
  };
}

const HEADER_WORDS = ['자료명', '자료', '담당자', '요청일', '필요일', '감사절차', '감사 절차', '절차'];

/** 한 줄을 열로 나눈다. 탭이 없으면 공백 2칸 이상으로도 나눠 본다. */
function splitCells(line) {
  const cells = line.includes('\t') ? line.split('\t') : line.split(/ {2,}/);
  return cells.map((c) => c.trim());
}

function isHeaderRow(cells) {
  return cells.filter(Boolean).length >= 2 && cells.some((c) => HEADER_WORDS.includes(c.replace(/\s+/g, '')));
}

/**
 * 엑셀에서 복사한 텍스트 파싱.
 * 열 순서: 자료명 · 담당자 · 요청일 · 필요일 · 감사절차(선택). 탭으로 열, 줄바꿈으로 행을 나눈다.
 * @returns {{ rows: { line, cells, value, errors }[], headerSkipped: boolean, errorCount: number }}
 */
function parsePaste(text, baseDate) {
  const lines = String(text ?? '').split(/\r?\n/).filter((l) => l.trim());
  let headerSkipped = false;
  if (lines.length && isHeaderRow(splitCells(lines[0]))) {
    lines.shift();
    headerSkipped = true;
  }

  const rows = lines.map((line, i) => {
    const cells = splitCells(line);
    const [name, owner, requestedOn, neededOn, procedure] = cells;
    const { errors, value } = validateItem(
      { name, ownerName: owner, requestedOn, neededOn, procedure }, baseDate);
    if (cells.length < 4 && !Object.keys(errors).length) errors.cells = '열이 부족해요.';
    return { line: i + 1, cells, value, errors };
  });

  return { rows, headerSkipped, errorCount: rows.filter((r) => Object.keys(r.errors).length).length };
}

// ---------- 중복 요청 막기 ----------
// 자료명이 대시보드의 자료와 같으면(띄어쓰기·대소문자 무시) 이미 요청한 자료로 보고 추가하지 않는다.

const STATUS_TEXT = { none: '미회신', part: '일부 수령', fix: '보완 요청', follow: '후속 절차', done: '완료' };

const normName = (name) => String(name ?? '').replace(/\s+/g, '').toLowerCase();

/** 대시보드에 같은 자료명이 있으면 그 자료 */
function findExisting(items, name) {
  const key = normName(name);
  return key ? items.find((x) => normName(x.name) === key) : undefined;
}

/** 이미 있는 자료일 때 보여줄 문구. 없으면 null */
function duplicateMessage(items, name) {
  const found = findExisting(items, name);
  return found ? `이미 대시보드에 있는 자료예요 (${found.owner} · ${STATUS_TEXT[found.status] || found.status})` : null;
}

/**
 * 붙여넣기 결과에 중복을 표시한다: 대시보드에 이미 있거나, 붙여넣은 목록 안에서 앞 행과 같은 자료명.
 * 중복 행은 value를 비워 저장 대상에서 빠지고, errorCount에 더해진다.
 */
function markDuplicates(parsed, items) {
  const seen = new Map();
  const rows = parsed.rows.map((r) => {
    if (!r.value) return r;
    const key = normName(r.value.item.name);
    let dup = null;
    if (findExisting(items, r.value.item.name)) dup = '이미 있는 자료';
    else if (seen.has(key)) dup = `${seen.get(key)}행과 중복`;
    seen.set(key, seen.get(key) ?? r.line);
    return dup ? { ...r, value: null, errors: { ...r.errors, duplicate: dup } } : r;
  });

/** 행 오류를 한 줄 문구로 */
function rowErrorText(errors) {
  const order = ['name', 'ownerName', 'requestedOn', 'neededOn', 'cells', 'duplicate'];
  const labels = { name: '자료명 없음', ownerName: '담당자 없음', cells: '열 부족' };
  return order.filter((k) => errors[k]).map((k) => {
    if (k === 'requestedOn') return errors[k].includes('형식') ? '요청일 형식 오류' : '요청일 없음';
    if (k === 'neededOn') return errors[k].includes('형식') ? '필요일 형식 오류' : '필요일 없음';
    if (k === 'duplicate') return errors[k];
    return labels[k];
  }).join(' · ');

function leftOf(value, baseDate) {
  return daysBetween(baseDate, value.item.neededOn);
}

})();

const __m_lib_attach = (() => {

// 완료한 자료에 받은 파일을 첨부한다. 파일 내용은 브라우저 저장소(files.js, IndexedDB)에,

const MAX_FILE_BYTES = 20 * 1024 * 1024; // 한 파일 20MB까지

/** 1536 → '1.5KB' */
function formatSize(bytes) {
  const n = Number(bytes) || 0;
  if (n < 1024) return `${n}B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(n < 10 * 1024 ? 1 : 0)}KB`;
  return `${(n / 1024 / 1024).toFixed(1)}MB`;
}

/**
 * 고른 파일 검사. files: [{ name, size }]
 * - 빈 파일, 너무 큰 파일은 뺀다
 * - 이 자료에 이미 같은 이름으로 첨부한 파일, 이번에 고른 것 안에서 같은 이름도 뺀다
 * @returns {{ ok: object[], rejected: { name, reason }[] }}
 */
function checkFiles(files, existing = [], maxBytes = MAX_FILE_BYTES) {
  const names = new Set(existing.map((a) => a.name));
  const ok = [];
  const rejected = [];
  for (const f of files) {
    if (!f.size) rejected.push({ name: f.name, reason: '빈 파일' });
    else if (f.size > maxBytes) rejected.push({ name: f.name, reason: `${formatSize(maxBytes)} 초과` });
    else if (names.has(f.name)) rejected.push({ name: f.name, reason: '이미 첨부한 파일' });
    else { names.add(f.name); ok.push(f); }
  }
  return { ok, rejected };
}

/** 첨부 목록을 더한 새 자료 */
function addAttachments(item, metas) {
  return { ...item, attachments: [...(item.attachments || []), ...metas] };
}

/** 첨부 하나를 뺀 새 자료 */

  return { ...item, attachments: (item.attachments || []).filter((a) => a.id !== fileId) };

const IMAGE_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg'];

/** 미리보기 방식: 'image' | 'pdf' | 'text' | 'none'(엑셀·워드 등 브라우저가 직접 못 여는 형식) */

  if (type === 'application/pdf' || ext === 'pdf') return 'pdf';
  if (type.startsWith('text/') || TEXT_EXT.includes(ext)) return 'text';
  return 'none';

/**
 * 단어 끝 글자의 받침 유무로 조사를 고른다.
 * josa('은행조회서 회신', '이', '가') → '이'
 * 한글로 끝나지 않으면 판단할 수 없어 '이(가)' 형태로 둘 다 쓴다.
 * 끝에 붙은 괄호(조회처명 등)는 빼고 판단한다.
 */
function josa(word, withBatchim, withoutBatchim) {
  // '채권채무조회서 (세진물산㈜)'처럼 괄호로 끝나면 괄호 앞 단어로 읽는다 → '조회서' + '가'
  const base = String(word).replace(/\s*\([^()]*\)$/, '') || String(word);
  const code = base.charCodeAt(base.length - 1) - 0xac00;
  if (code < 0 || code > 11171) return `${withBatchim}(${withoutBatchim})`;
  return code % 28 === 0 ? withoutBatchim : withBatchim;
}

return { josa };
})();

function withDays(item, today) {

    ...item,

    elapsed: daysBetween(item.requestedOn, today),

  { key: 'polite', name: '정중', emoji: '🙂' },
  { key: 'firm', name: '단호', emoji: '😐' },
  { key: 'cc', name: '매니저 참조', emoji: '🔥' },

  return TONES.findIndex((t) => t.key === key);

  return TONES[toneIndex(key)]?.name ?? key;
}

/**
 * 기본 추천 톤.
 * 1) 필요일까지 남은 날로 출발: 지연 → 단호, 2일 이내 → 정중, 그 외 → 천사
 * 2) 요청한 지 7일 이상 지났으면 한 단계 올린다 (최대 매니저 참조)
 */
function recommendTone({ left, elapsed }) {
  let level = left < 0 ? 2 : left <= 2 ? 1 : 0;
  if (elapsed >= 7) level += 1;
  return TONES[Math.min(level, TONES.length - 1)].key;
}

/** 추천 근거: '남은 1일 · 요청 후 3일' */
function recommendBasis({ left, elapsed }) {
  const leftPart = left < 0 ? `필요일 ${-left}일 지남` : left === 0 ? '오늘 필요' : `남은 ${left}일`;
  return `${leftPart} · 요청 후 ${elapsed}일`;

  else if (!BANK_CATEGORIES.some((w) => category.includes(w))) errors.category = '구분 확인 (예금·차입금·보증·담보·약정 등)';
  const bookAmount = parseAmount(amount);
  if (Number.isNaN(bookAmount)) errors.amount = '금액 형식 오류';
  return { errors, value: { name, branch, address, category, desc, bookAmount } };
}

function parseArapRow(cells) {
  const [name = '', address = '', recv = '', pay = '', form = ''] = cells;
  const errors = {};
  if (!name) errors.name = '거래처명 없음';
  if (!address) errors.address = '주소 없음';
  const receivable = parseAmount(recv);
  const payable = parseAmount(pay);
  if (Number.isNaN(receivable) || Number.isNaN(payable)) errors.amount = '금액 형식 오류';
  else if (receivable === null && payable === null) errors.amount = '채권·채무 금액 없음';
  const f = form.replace(/\s+/g, '');
  let blank = false;
  if (!f || f === '기재' || f.includes('기재')) blank = false;
  else if (f.includes('공란')) blank = true;
  else errors.form = '형식은 기재 또는 공란';
  return { errors, value: { name, address, receivable: receivable ?? 0, payable: payable ?? 0, blank } };
}

function parseLegalRow(cells) {
  const [name = '', lawyer = '', address = '', matter = ''] = cells;
  const errors = {};
  if (!name) errors.name = '법무법인명 없음';
  return { errors, value: { name, lawyer, address, matter } };
}

function parseInventoryRow(cells) {
  const [name = '', branch = '', address = '', item = '', qty = '', unit = '', amount = ''] = cells;
  const errors = {};
  if (!name) errors.name = '보관처명 없음';
  if (!item) errors.category = '품목 없음';
  const quantity = parseAmount(qty);
  if (quantity === null) errors.amount = '수량 없음';
  else if (Number.isNaN(quantity)) errors.amount = '수량 형식 오류';
  const bookAmount = parseAmount(amount);
  if (Number.isNaN(bookAmount)) errors.amount = '금액 형식 오류';
  return { errors, value: { name, branch, address, item, quantity, unit, bookAmount } };
}

const ROW_PARSERS = { bank: parseBankRow, arap: parseArapRow, legal: parseLegalRow, inventory: parseInventoryRow };

/**
 * 붙여넣은 목록을 조회처 단위로 묶는다.
 * @returns {{
 *   rows: { line, cells, value, errors }[],
 *   parties: { key, name, branch?, lawyer?, address, lines: number[], ...type별 값, errors }[],
 *   headerSkipped, errorCount
 * }}
 * errorCount는 행 오류 + 조회처 오류(주소 없음·주소 불일치·중복 거래처) 합계. 0이어야 조회서를 만든다.
 */
function parseConfirmations(type, text) {
  const { rows: raw, headerSkipped } = readRows(text);
  const rows = raw.map((r) => ({ ...r, ...ROW_PARSERS[type](r.cells) }));
  const parties = type === 'arap' ? arapParties(rows) : groupedParties(type, rows);
  const rowErrors = rows.filter((r) => Object.keys(r.errors).length).length;
  const partyErrors = parties.filter((p) => Object.keys(p.errors).length).length;
  return { rows, parties, headerSkipped, errorCount: rowErrors + partyErrors };
}

function arapParties(rows) {
  const seen = new Map();
  return rows.filter((r) => r.value.name).map((r) => {
    const key = r.value.name.replace(/\s+/g, '');
    const errors = {};
    if (seen.has(key)) errors.duplicate = `${seen.get(key)}행과 거래처 중복`;
    else seen.set(key, r.line);
    return { key, ...r.value, lines: [r.line], errors };
  });
}

/** 은행(금융기관+지점)·재고(보관처+창고)·변호사(법무법인)는 여러 행을 한 조회처로 묶는다. */
function groupedParties(type, rows) {
  const groups = new Map();
  for (const r of rows) {
    if (!r.value.name) continue;
    const key = type === 'legal' ? r.value.name : `${r.value.name}|${r.value.branch}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  return [...groups].map(([key, rs]) => {
    const first = rs[0].value;
    const addresses = [...new Set(rs.map((r) => r.value.address).filter(Boolean))];
    const errors = {};
    if (!addresses.length) errors.address = '주소 없음';
    else if (addresses.length > 1) errors.address = '같은 조회처에 주소가 여러 개';
    const party = { key, name: first.name, address: addresses[0] || '', lines: rs.map((r) => r.line), errors };
    if (type === 'bank') {
      party.branch = first.branch;
      party.entries = rs.map((r) => ({ category: r.value.category, desc: r.value.desc, bookAmount: r.value.bookAmount }));
    } else if (type === 'inventory') {
      party.branch = first.branch;
      party.goods = rs.map((r) => ({ item: r.value.item, quantity: r.value.quantity, unit: r.value.unit, bookAmount: r.value.bookAmount }));
    } else {
      party.lawyer = rs.map((r) => r.value.lawyer).find(Boolean) || '';
      party.matters = rs.map((r) => r.value.matter).filter(Boolean);
    }
    return party;
  });
}

/** '2026-12-31' → '2026년 12월 31일' */
function longKoreanDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${y}년 ${m}월 ${d}일`;
}

function docNo(type, n) {
  return `${CONF_TYPES[type].prefix}-${String(n).padStart(3, '0')}`;
}

function recipientName(type, p) {
  if (type === 'bank' || type === 'inventory') return `${p.name}${p.branch ? ` ${p.branch}` : ''}`;
  return p.name;
}

/**
 * 조회서 문서 데이터. 화면·인쇄는 이 데이터만 보고 그린다.
 * @param opts { startNo = 1, bankBlank = false }  bankBlank: 은행조회서 장부금액을 비워 보낼지
 * @returns letter[] — { type, docNo, title, issuedOn, to, from, paragraphs, table, notes, reply, replyTo, party }
 */
function buildLetters(type, parties, setup, { startNo = 1, bankBlank = false } = {}) {
  return parties.map((p, i) => {
    const base = longKoreanDate(setup.baseDate);
    const by = longKoreanDate(setup.replyBy);
    const letter = {
      type,
      docNo: docNo(type, startNo + i),
      title: CONF_TYPES[type].title,
      issuedOn: longKoreanDate(setup.issuedOn),
      to: { name: recipientName(type, p), attn: type === 'legal' ? p.lawyer : '', address: p.address },
      from: { company: setup.companyName, ceo: setup.ceoName, address: setup.companyAddress },
      replyTo: {
        auditor: setup.auditorName, address: setup.auditorAddress, contact: setup.contactName,
        phone: setup.contactPhone, email: setup.contactEmail,
      },
      replyBy: by,
      party: p,
    };
    return { ...letter, ...LETTER_BODY[type](p, setup, base, by, { bankBlank }) };
  });
}

/** 이미 등록된 같은 종류 조회서 수 + 1 → 다음 문서번호 */
function nextDocNo(items, type) {
  return items.filter((x) => x.kind === 'confirmation' && x.confType === type).length + 1;
}

/**
 * 조회서를 대시보드 조회 목록에 넣을 값으로 바꾼다. store.addItems()에 그대로 넘긴다.
 * 조회처를 담당자(owner)로 두어 기존 대시보드의 담당자별 묶음·독촉 이력이 그대로 동작한다.
 * 요청일 = 발송일, 필요일 = 회신 기한.
 */
function toRegistryValues(letters, setup) {
  return letters.map((l) => {
    const p = l.party;
    const item = {
      kind: 'confirmation',
      confType: l.type,
      docNo: l.docNo,
      name: `${CONF_TYPES[l.type].label} (${l.to.name})`,
      owner: l.to.name,
      counterparty: l.to.name,
      requestedOn: setup.issuedOn,
      neededOn: setup.replyBy,
      baseDate: setup.baseDate,
      status: 'none',
      procedure: '외부조회',
      track: CONF_TYPES[l.type].track,
      blank: l.blank,
      nudges: [],
    };
    if (l.type === 'bank') {
      item.bookAmount = p.entries.reduce((s, e) => s + (e.bookAmount || 0), 0);
    } else if (l.type === 'inventory') {
      item.bookAmount = p.goods.reduce((s, g) => s + (g.bookAmount || 0), 0);
    } else if (l.type === 'arap') {
      item.receivable = p.receivable;
      item.payable = p.payable;
      item.bookAmount = p.receivable + p.payable;
    }
    return { item, person: { owner: l.to.name, dept: CONF_TYPES[l.type].unit } };
  });
}

/** 기존 자료(kind 없음)는 PBC로 본다. */
function isConfirmation(item) {
  return item?.kind === 'confirmation';
}

return { CONF_TYPES, TRACK_LABEL, TYPE_ORDER, BANK_CATEGORIES, defaultSetup, validateSetup, parseAmount, formatAmount, parseConfirmations, longKoreanDate, buildLetters, nextDocNo, toRegistryValues, isConfirmation };
})();

const key = (s) => String(s ?? '').replace(/㈜|\(주\)|주식회사|\s+/g, '').toLowerCase();

/** 클라이언트명 일부로 조회. 빈 검색어면 빈 목록. */
function searchEngagements(query, list = ENGAGEMENTS) {
  const q = key(query);
  return q ? list.filter((e) => key(e.client).includes(q)) : [];

function engagementById(id, list = ENGAGEMENTS) {
  return list.find((e) => e.id === id) || null;

 * 매니저는 팀원 맨 뒤.
 */
function teamFromEngagement(eng, myName, myTitle) {
  const name = String(myName ?? '').trim().replace(/\s+/g, ' ');
  const title = String(myTitle ?? '').trim();
  const label = [name, title].filter(Boolean).join(' ');
  const pool = [...eng.members, eng.manager];
  const found = pool.find((m) => m === label) || pool.find((m) => m.split(' ')[0] === name && (!title || m === label));
  const me = found || label;
  const members = [...new Set([me, ...eng.members, eng.manager])];
  return { manager: { name: eng.manager, dept: '감사팀' }, members, me };
}

return { ENGAGEMENTS, searchEngagements, engagementById, validateStart, teamFromEngagement };

// 4. 보완 요청: 받은 자료에 문제가 있을 때, 사유에 맞는 재요청 메일
// 톤은 항상 정중. 복사해도 상태는 '보완 요청' 그대로 둔다.


const FIX_REASONS = [
  { key: 'date', label: '기준일 상이', hint: '다른 기준일 자료가 옴' },
  { key: 'sign', label: '서명 누락', hint: '확인·승인 서명이 없음' },
  { key: 'missing', label: '일부 항목 누락', hint: '요청 범위 중 일부가 빠짐' },

];

// 자료에 세부 항목이 없을 때 쓰는 기본값
const DEFAULT_DETAIL = {
  sign: '확인·승인란',
  missing: '요청 범위 중 일부 항목',
};

function fixReasonLabel(key) {
  return FIX_REASONS.find((r) => r.key === key)?.label ?? key;
}

/** 보완 요청 화면은 상태가 '보완 요청'인 자료만 연다. */
function canOpenFix(item) {
  return Boolean(item) && item.status === 'fix';
}

/** 화면을 열 때 선택돼 있을 사유: 자료에 저장된 현재 사유, 없으면 기준일 상이 */
function currentFixReason(item) {
  return item.fix?.reason || 'date';
}

function fixDetail(item, reason) {
  return item.fix?.details?.[reason] || DEFAULT_DETAIL[reason] || '';
}

/** 대시보드 행에 보이는 한 줄 요약 (item.reason) */
function fixSummary(item, reason) {
  switch (reason) {
    case 'date': {
      const required = item.fix?.requiredBasisDate;
      return `기준일 상이 · ${required ? `${formatMD(required)} 기준 ` : ''}재요청 필요`;
    }
    case 'sign': return '서명 누락 · 서명본 재요청 필요';
    case 'missing': return '일부 항목 누락 · 누락 항목 추가 요청';
    default: return '파일 오류 · 파일 재전송 요청';
  }
}

/**
 * @returns {{ subject, to: {name, dept}, segments }}
 * segments 형식은 단건 독촉 메일과 같다 (field / reason / plain).
 */
function buildFixMail({ item, person = {}, client, today, reason }) {
  const field = (text) => ({ kind: 'field', text });
  const why = (text) => ({ kind: 'reason', text });
  const plain = (text) => ({ kind: 'plain', text });

  const left = daysBetween(today, item.neededOn);
  const need = formatMD(item.neededOn);
  const t = termsOf(client.service);
  const proc = `${item.procedure || t.defaultProcedure} 절차`;
  const prefix = `[${clientShortName(client.name)} ${t.mailTag}] ${item.name}`;
  const detail = fixDetail(item, reason);

  let subject;
  let problem;
  if (reason === 'date') {
    const received = item.received?.basisDate;
    const required = item.fix?.requiredBasisDate;
    const yearEnd = required?.endsWith('-12-31');
    subject = `${prefix} 재요청 — 기준일 확인 부탁드립니다`;
    problem = [
      plain('기준일이 '), field(received ? formatMD(received) : '다른 날짜'), plain('로 되어 있어, '),
      plain(yearEnd ? '결산 기준일(' : '요청드린 기준일('), field(required ? formatMD(required) : '요청 기준일'),
      plain(') 자료로 다시 부탁드립니다. '),
    ];
  } else if (reason === 'sign') {
    subject = `${prefix} 재요청 — 서명본 부탁드립니다`;
    problem = [
      field(detail), plain('에 서명 또는 날인이 빠져 있어, 서명(날인)된 본으로 다시 부탁드립니다. 스캔본도 괜찮습니다. '),
    ];
  } else if (reason === 'missing') {
    subject = `${prefix} — 누락 항목 추가 요청`;
    problem = [
      field(detail), plain(`${josa(detail, '이', '가')} 빠져 있어, 해당 부분만 추가로 부탁드립니다. `),
    ];
  } else {
    subject = `${prefix} — 파일 재전송 요청`;
    problem = [
      plain('첨부해 주신 파일이 '), field('열리지 않거나 내용이 깨져 보여'),
      plain(' 확인이 어렵습니다. 번거로우시겠지만 파일을 한 번 더 보내주실 수 있을까요? '),
    ];
  }

  const schedule = left < 0
    ? [why(`${t.schedule}상 ${proc}를 `), field(need), why('부터 사용할 예정이었어서'), plain(', 가능한 한 빨리 부탁드립니다.')]
    : [why(`${t.schedule}상 ${proc}를 `), field(need), why('에 시작해야 해서'), plain(', '), field(need), plain('까지 필요합니다.')];

  return {
    subject,
    to: { name: item.owner, dept: person.dept || '' },
    segments: [
      field(`${item.owner}님`), plain(', 안녕하세요.\n\n보내주신 '), field(item.name), plain(' 잘 받았습니다. 다만 '),
      ...problem,
      ...schedule,
      plain('\n\n감사합니다.\n[이름] 드림'),
    ],
  };
}

/** 클립보드용: 제목 / 받는 사람 / 본문 */
function fixMailToText(mail) {
  const body = mail.segments.map((s) => s.text).join('');
  return `제목: ${mail.subject}\n받는 사람: ${mail.to.name}\n\n${body}`;
}

return { FIX_REASONS, fixReasonLabel, canOpenFix, currentFixReason, fixDetail, fixSummary, buildFixMail, fixMailToText };
})();

  ctx.restore();
}

// 전자신고 접수 도장 (사각)
function receipt(ctx, lines, x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(0.04);
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = '#2f55a4';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, 300, 112);
  lines.forEach((l, i) => text(ctx, l, 150, 26 + i * 32, { px: i === 0 ? 24 : 18, bold: i === 0, align: 'center', color: '#2f55a4', serif: false }));
  ctx.restore();
}

function drawDoc(ctx, doc) {
  let y = 120;
  if (doc.docNo) text(ctx, `No. ${doc.docNo}`, W - M, y - 30, { px: 18, align: 'right', color: '#5b6068', serif: false });
  text(ctx, doc.title, W / 2, y + 20, { px: 40, bold: true, align: 'center' });
  y += 70;
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke();
  y += 46;
  if (doc.to) { text(ctx, doc.to, M, y, { px: 23, bold: true }); y += 50; }
  for (const [k, v] of doc.meta) {
    text(ctx, k, M + 6, y, { px: 21, color: '#4b4f55' });
    text(ctx, `:  ${v}`, M + 210, y, { px: 21 });
    y += 38;
  }
  y += 14;
  if (doc.lead) { text(ctx, doc.lead, M, y, { px: 21 }); y += 52; }
  for (const s of doc.sections) {
    text(ctx, s.heading, M, y, { px: 22, bold: true });
    y = table(ctx, s, y + 24) + 44;
  }
  if (doc.remark) { text(ctx, doc.remark, M, y, { px: 20, color: '#3a3e44' }); y += 70; }
  const sy = Math.min(y + 90, H - 330);
  text(ctx, doc.signed.date, W / 2, sy, { px: 23, align: 'center' });
  text(ctx, doc.signed.org, W - M - 180, sy + 80, { px: 23, align: 'right', bold: true });
  text(ctx, doc.signed.person, W - M - 180, sy + 124, { px: 22, align: 'right' });
  if (doc.signed.stamp) stamp(ctx, doc.signed.stamp, W - M - 110, sy + 106);
  if (doc.receipt) receipt(ctx, doc.receipt, W - M - 300, 210);
}

// 스캔 느낌: 누런 종이, 약간 기울어짐, 가장자리 그림자, 잡점
function scanEffect(ctx, draw, seed) {
  const rand = rng(seed);
  ctx.fillStyle = '#f7f5ef';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate((rand() - 0.5) * 0.012);
  ctx.translate(-W / 2, -H / 2);
  draw();
  ctx.restore();
  for (let i = 0; i < 2600; i++) {
    ctx.fillStyle = `rgba(40,40,40,${rand() * 0.18})`;
    ctx.fillRect(rand() * W, rand() * H, rand() * 1.8 + 0.4, rand() * 1.8 + 0.4);
  }
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.10)'); g.addColorStop(0.04, 'rgba(0,0,0,0)');
  g.addColorStop(0.96, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.08)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 시연용 표시 (작게)
  text(ctx, 'PBC Mate 시연용 예시 문서 · 가공의 자료', W / 2, H - 34, { px: 15, align: 'center', color: 'rgba(90,90,90,0.75)', serif: false });
}

/** 문서 내용 → PNG Blob */
async function renderScan(doc, seed = 7) {
  try { await document.fonts?.ready; } catch { /* 글꼴 대기 실패는 무시 */ }
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  scanEffect(ctx, () => drawDoc(ctx, doc), seed);
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png'));
}

return { renderScan };

function recordNudges(state, itemIds, tone, on) {
  const ids = new Set(itemIds);
  const owner = state.items.find((x) => ids.has(x.id)).owner;
  const person = state.people[owner] || {};
  return {
    ...state,
    items: state.items.map((x) =>
      ids.has(x.id) ? { ...x, nudges: [...(x.nudges || []), { on, tone }] } : x),

function recordFix(state, itemId, reason, on) {

    ...state,
    items: state.items.map((x) => (x.id !== itemId ? x : {

async function copyThenApply(state, text, copy, apply) {

  return copyThenApply(state, text, copy, (s) => recordFix(s, itemId, reason, on));

 * 자료를 추가한다. values: validateItem()의 value 배열 [{ item, person }].

function addItems(state, values) {
  const people = { ...state.people };
  const items = [...state.items];

      ? { ...existing, dept: existing.dept || person.dept || '' }

// 지금 쓰는 사람: 팀원끼리 같은 화면에서 바꿔 쓸 수 있다 (데이터는 브라우저마다 따로 저장)
function userPicker(team) {
  const members = team?.members?.length ? team.members : team?.me ? [team.me] : [];
  if (!members.length) return '';
  return `
    <label class="me-picker" title="지금 쓰는 사람 · 요청 감사인과 메일 서명에 들어가요">
      <span class="me-dot" aria-hidden="true">${esc((team.me || members[0]).slice(0, 1))}</span>
      <select data-action-change="switch-user" aria-label="지금 쓰는 사람">
        ${members.map((m) => `<option value="${esc(m)}" ${m === team.me ? 'selected' : ''}>${esc(m)}</option>`).join('')}
      </select>
    </label>`;
}

function insightSection(ins, sum, t) {
  const headline = sum.urgent
    ? `오늘 먼저 챙길 자료가 ${sum.urgent}건 있어요`
    : '오늘 당장 급한 자료는 없어요';
  return `
    <section class="hero">
      <div class="hero-text">
        <h1>${headline}</h1>
        <p class="hero-sub">${t.heroSub}</p>
        <div class="hero-insight"><span class="eyebrow">${ins.eyebrow}</span><b>${esc(ins.title)}</b><span>${ins.sub}</span></div>
      </div>
      <div class="hero-deco" aria-hidden="true"><span></span><span></span></div>
    </section>
    <dl class="summary">
        <div class="${sum.urgent ? 'is-alert' : ''}">
          <dt>${sum.urgent ? ICON.high : ''}긴급 자료</dt><dd>${sum.urgent}건</dd>
          <span class="kpi-note desktop-only">지연 · 2일 이내</span>
        </div>
        <div><dt>7일 이내<span class="desktop-only">&nbsp;필요</span></dt><dd>${sum.dueWeek}건</dd></div>
        <div><dt>보완 요청</dt><dd>${sum.needsFix}건</dd></div>
        <div><dt>미완료</dt><dd>${sum.open}건 <small>/ ${sum.total}</small></dd></div>
    </dl>`;
}

// 요청 감사인 필터: 전체 / 내 요청 / 팀원. 건수는 미완료 기준.
function requesterFilter(who, members, me, openItems) {
  const count = (name) => openItems.filter((x) => x.requester === name).length;
  const btn = (value, caption, label) => `
    <button type="button" data-action="set-who" data-who="${esc(value)}" aria-pressed="${who === value}">
      <span class="seg-caption">${caption}</span><span class="seg-label">${label}</span>
    </button>`;
  const others = members.filter((m) => m !== me);
  return `
    <section class="mode-bar who-bar">
      <div class="mode-title">요청 감사인</div>
      <div class="segmented" role="group" aria-label="요청 감사인">
        ${btn('all', '팀 전체', `전체 ${openItems.length}`)}
        ${me ? btn('me', esc(me), `내 요청 ${count(me)}`) : ''}
        ${others.map((m) => btn(m, '팀원', `${esc(m)} ${count(m)}`)).join('')}
      </div>
      <div class="mode-hint">${who === 'all' ? '팀 전체가 요청 중인 자료예요.' : '고른 감사인이 요청한 자료만 보여요.'}</div>
    </section>`;
}

function modeToggle(mode, hint, t) {
  const btn = (value, caption, label) => `
    <button type="button" data-action="set-mode" data-mode="${value}" aria-pressed="${mode === value}">
      <span class="seg-caption">${caption}</span><span class="seg-label">${label}</span>
    </button>`;
  return `
    <section class="mode-bar">
      <div class="mode-title">우선순위 기준</div>
      <div class="segmented" role="group" aria-label="우선순위 기준">
        ${btn('need', `${t.schedule} 기준`, '필요일순')}
        ${btn('elapsed', '요청 경과 기준', '경과일순')}
      </div>
      <div class="mode-hint">${hint}</div>
      <span class="tip">
        <button type="button" class="tip-btn">${ICON.help}필요일이란?</button>
        <span class="tip-box" role="tooltip"><b>필요일</b> = ${t.needDef}<br>
          <span class="muted">자료를 추가할 때 ${t.procedure}${josa(t.procedure, '을', '를')} 적어 두면 메일 근거 문장에 들어가요.</span></span>
      </span>
      <div class="mode-def mobile-only">필요일 = ${t.needDef}</div>
    </section>`;
}

// 필요일 타임라인: 오늘(0일)부터 가장 먼 필요일까지. 최소 15일 폭으로 그린다.
function timeline(sorted, today) {
  const span = Math.max(15, Math.max(...sorted.map((x) => x.left)) + 1);
  const pct = (days) => `${(Math.max(0, days) / span) * 100}%`;

  const byLeft = [...sorted].sort((a, b) => a.left - b.left);
  const marks = byLeft.map((x, i) => {
    const pos = Math.max(0, x.left) / span;
    const side = i % 2 === 0 ? 'above' : 'below';
    const anchor = pos > 0.85 ? 'end' : 'start';
    const extra = x.status === 'fix' ? ' · 보완 요청' : x.status === 'follow' ? ' · 후속 절차' : '';
    return `
      <div class="tl-mark risk-${x.risk} ${side} anchor-${anchor}" style="left:${pct(x.left)}">
        <span class="tl-stem"></span><span class="tl-dot"></span>
        <a class="tl-label ${x.risk === 'high' || x.risk === 'late' ? 'is-urgent' : ''} ${x.status === 'fix' ? 'is-fix' : ''}" href="${itemHref(x)}" title="${esc(x.name)} · ${esc(x.owner)} — 눌러서 열기">
          <b>${esc(x.name)}</b><span>${formatMD(x.neededOn)} · ${leftText(x.left)}${extra}</span>
        </a>
      </div>`;
  }).join('');

  const ticks = tickDays(today, span).map((d) =>
    `<span class="tl-tick" style="left:${pct(d)}">${formatMD(addDays(today, d))}</span>`).join('');

  return `
    <section class="timeline desktop-only">
      <div class="tl-head">
        <div class="tl-title">필요일 타임라인 <span>· 오늘부터 각 자료의 필요일까지</span></div>
        <div class="tl-legend">
          <span class="risk-high">${ICON.high}<i>2일 이내</i></span>
          <span class="risk-mid">${ICON.mid}<i>3~7일</i></span>
          <span class="risk-low">${ICON.low}<i>8일 이상</i></span>
        </div>
      </div>
      <div class="tl-track">
        <div class="tl-seg risk-high" style="left:0;width:${pct(Math.min(2, span))}"></div>
        <div class="tl-seg risk-mid" style="left:${pct(2)};width:${pct(Math.min(5, span - 2))}"></div>
        <div class="tl-seg risk-low" style="left:${pct(7)};right:0"></div>
        <span class="tl-now"></span>
        <span class="tl-tick is-today" style="left:0">오늘 ${formatMD(today)}</span>
        ${ticks}
        ${marks}
      </div>
    </section>`;
}

// 날짜 눈금: 5의 배수 날짜(5, 10, 15 …)에 표시하되 오늘 라벨과 겹치지 않게 3일 이후부터.
function tickDays(today, span) {
  const days = [];
  for (let d = 3; d < span; d++) {
    if (Number(addDays(today, d).slice(8)) % 5 === 0) days.push(d);
  }
  return days;
}

function composeHref(item) {
  return `#/compose/${encodeURIComponent(item.id)}`;
}

function bundleHref(owner) {
  return `#/bundle/${encodeURIComponent(owner)}`;
}

function fixHref(item) {
  return `#/fix/${encodeURIComponent(item.id)}`;
}

// 자료를 눌렀을 때: 보완 요청 자료는 보완 요청 화면, 나머지는 단건 독촉
function followHref(item) {
  return `#/follow/${encodeURIComponent(item.id)}`;
}

function itemHref(x) {
  if (x.status === 'follow') return followHref(x);
  return x.status === 'fix' ? fixHref(x) : composeHref(x);
}

function nameLink(x) {
  return `<a class="row-name" href="${itemHref(x)}">${esc(x.name)}</a>`;
}

function statusBadge(status) {
  return `<span class="status status-${status}">${ICON[status]}${STATUS_LABEL[status]}</span>`;
}

function riskBadge(risk, short = false) {
  return `<span class="risk risk-${risk}">${ICON[risk]}${short ? RISK_SHORT[risk] : RISK_LABEL[risk]}</span>`;
}

function itemMeta(x) {
  if (x.status === 'fix') return x.reason || '보완 요청';
  if (x.status === 'follow') return x.follow?.type === 'diff' ? '회신 금액 차이 · 조정 중' : '미회수 확정 · 대체적 절차 진행 중';
  return `${formatMD(x.neededOn)} 필요 · 요청 ${formatMD(x.requestedOn)} · D+${x.elapsed}`;
}

function rowActionLabel(x) {
  if (x.status === 'fix') return '보완 재요청 메일 쓰기';
  if (x.status === 'follow') return '후속 절차 열기';
  return '이 자료만 따로 독촉';
}

function leftBig(left) {
  if (left === 0) return `<b>오늘</b>`;
  return `<b>${Math.abs(left)}</b><span>${left > 0 ? '일 남음' : '일 지남'}</span>`;
}

function ownerCards(groups, people, done, text) {
  const topId = groups[0].items[0].id;

  const cards = groups.map((g, i) => {
    const person = people[g.owner] || {};
    const doneHere = done.filter((x) => x.owner === g.owner);
    const nudged = person.nudges
      ? `마지막 독촉 ${formatMD(person.lastNudgedOn)} · 독촉 ${person.nudges}회`
      : '아직 독촉하지 않았어요';

    // 묶음 독촉 대상이 2건 이상인 카드: 항목마다 따로 보내는 경우를 위한 버튼을 붙인다.
    const bundlable = g.items.filter(isBundleEligible);
    const perItem = bundlable.length > 1;

    const rows = g.items.map((x) => `
      <div class="row ${x.id === topId ? 'is-top' : ''}">
        <div class="row-main">
          <div class="row-title">
            ${nameLink(x)}
            ${x.id === topId ? `<span class="top-badge">${text.top}</span>` : ''}
          </div>
          <div class="row-meta">${statusBadge(x.status)}<span class="ellipsis">${esc(itemMeta(x))}</span></div>
          ${perItem ? `<a class="row-action" href="${itemHref(x)}">${ICON.mail}${rowActionLabel(x)}</a>` : ''}
        </div>
        <div class="row-left">
          <div class="left-big">${leftBig(x.left)}</div>
          ${riskBadge(x.risk)}
        </div>
      </div>`).join('');

    const doneLine = doneHere.length
      ? `<div class="done-line">${ICON.done}완료 ${doneHere.length}건 · ${doneHere.map((x) => esc(x.name)).join(', ')}</div>`
      : '';

    // 버튼 건수는 묶음 독촉 화면과 같은 기준(보완 요청 제외)으로 센다. (bundlable은 위에서 계산)
    let cta;
    if (bundlable.length > 1) {
      cta = `<a class="btn btn-cta" href="${bundleHref(g.owner)}">
        ${bundlable.length}건 묶어서 독촉 <span class="cta-sub">· 메일 1통</span></a>`;
    } else if (bundlable.length === 1) {
      cta = `<a class="btn btn-sub" href="${composeHref(bundlable[0])}">${esc(bundlable[0].name)} 독촉하기</a>`;
    } else {
      cta = g.items[0].status === 'follow'
        ? `<a class="btn btn-sub" href="${followHref(g.items[0])}">후속 절차 열기</a>`
        : `<a class="btn btn-sub" href="${fixHref(g.items[0])}">보완 재요청 메일 쓰기</a>`;
    }

    return `
      <div class="card">
        <div class="card-head">
          <div class="rank">${i + 1}</div>
          <div class="card-who">
            <div class="card-name">${esc(g.owner)} <span>${esc(person.dept || '')}</span></div>
            <div class="card-nudge">${nudged}</div>
          </div>
          <div class="card-count"><span>미완료</span><b>${g.items.length}건</b></div>
        </div>
        ${rows}
        ${doneLine}
        ${cta}
      </div>`;
  }).join('');

  return `
    <section class="owners desktop-only">
      <div class="section-head">
        <h2>담당자별(거래처별)로 묶어 재촉하기</h2>
        <div class="section-hint">같은 담당자에게는 메일 한 통으로 · ${text.group}</div>
      </div>
      <div class="cards">${cards}</div>
    </section>`;
}

// 모바일(레퍼런스 1-M): 담당자 묶음 대신 한 줄 목록 + 가장 많이 밀린 담당자 묶음 버튼
function mobileList(sorted, topLabel) {
  // 보완 요청 자료는 단건 독촉 대신 보완 요청 화면으로 연결한다.
  const rows = sorted.map((x, i) => `
    <a href="${itemHref(x)}" class="m-row ${i === 0 ? 'is-top' : ''}">
      <span class="m-left">
        <span class="m-days">${x.left === 0 ? '오늘' : `${Math.abs(x.left)}<small>일${x.left < 0 ? ' 지남' : ''}</small>`}</span>
        ${riskBadge(x.risk, true)}
      </span>
      <span class="m-main">
        <span class="row-title"><span class="row-name">${esc(x.name)}</span>${i === 0 ? `<span class="top-badge">${topLabel}</span>` : ''}</span>
        <span class="row-meta">${statusBadge(x.status)}<span class="ellipsis">${esc(x.status === 'fix' ? (x.reason || '보완 요청') : `${x.owner} · D+${x.elapsed}`)}</span></span>
      </span>
    </a>`).join('');

  const biggest = groupByOwner(sorted.filter(isBundleEligible))
    .reduce((a, b) => (b.items.length > a.items.length ? b : a), { items: [] });
  const bundle = biggest.items.length > 1 ? `
    <a class="m-bundle" href="${bundleHref(biggest.owner)}">
      <span><b>${esc(biggest.owner)} ${biggest.items.length}건 묶어서 독촉</b><small>개별 메일 ${biggest.items.length}통 대신 1통</small></span>
      ${ICON.chevron}
    </a>` : '';

  return `<section class="m-list mobile-only">${rows}</section>${bundle ? `<div class="mobile-only">${bundle}</div>` : ''}`;
}

function allDone() {
  return `
    <section class="all-done">
      ${ICON.done}
      <h1>요청한 자료를 모두 받았어요</h1>
      <p>새로 요청할 자료가 생기면 추가해 주세요.</p>
    </section>`;
}

return { renderDashboard, topbar };
})();

// 일정 탭: 월 달력 + 선택한 날의 일정. 자료 필요일은 자동, 사용자 일정은 추가/삭제/이동.
// 데스크톱은 드래그로 날짜 이동, 모바일은 날짜 입력칸으로 이동.


const DOW = ['일', '월', '화', '수', '목', '금', '토'];

/**
 * @param state 앱 상태
 * @param opts  { today, isDemo, month: 'YYYY-MM', selected: 'YYYY-MM-DD', form: { title, errors }, filter: 'all'|'done'|'doing'|'planned', scopeNote }
 *   scopeNote: 누구의 일정을 보여주는지 (회계사는 자기 자료만, 매니저는 전체)
 */
function renderCalendar(state, { today, isDemo, month, selected, form, filter = 'all', scopeNote = '' }) {
  const all = calendarEntries(state, today);
  const entries = filter === 'all' ? all : all.filter((e) => e.progress === filter);
  const grid = monthGrid(month);
  const inMonth = all.filter((e) => e.date.startsWith(month));
  const counts = countByProgress(inMonth);

  const cells = grid.map((c) => {
    const list = entriesOn(entries, c.date);
    const chips = list.slice(0, 3).map((e) => entryChip(e)).join('');
    const more = list.length > 3 ? `<span class="cal-more">+${list.length - 3}</span>` : '';
    return `
      <div class="cal-cell ${c.inMonth ? '' : 'is-out'} ${c.date === today ? 'is-today' : ''} ${c.date === selected ? 'is-selected' : ''} ${c.dow === 0 || c.dow === 6 ? 'is-weekend' : ''}"
           data-action="cal-select" data-date="${c.date}" data-drop="${c.date}">
        <div class="cal-day">${Number(c.date.slice(8))}</div>
        <div class="cal-chips">${chips}${more}</div>
      </div>`;
  }).join('');

  return `
    <div class="page calendar">
      ${topbar(state.client, today, isDemo, 'calendar', state.team)}

      <section class="cal-head">
        <div>
          <h1>${monthLabel(month)}</h1>
          ${scopeNote ? `<div class="cal-scope">${ICON.help}${esc(scopeNote)}</div>` : ''}
          <p class="cal-sub">이번 달 필요일 ${inMonth.filter((e) => e.kind === 'need').length}건 · 일정 ${inMonth.filter((e) => e.kind === 'event').length}건 · 항목을 끌어 다른 날에 놓으면 날짜가 바뀌어요</p>
        </div>
        <div class="cal-nav">
          <button type="button" class="btn btn-sub" data-action="cal-month" data-delta="-1" aria-label="이전 달">${ICON.back}</button>
          <button type="button" class="btn btn-sub" data-action="cal-today">오늘</button>
          <button type="button" class="btn btn-sub" data-action="cal-month" data-delta="1" aria-label="다음 달">${ICON.chevron}</button>
        </div>
      </section>

      <div class="progress-bar" role="group" aria-label="할 일 구분">
        <button type="button" class="progress-tab" data-action="cal-filter" data-filter="all" aria-pressed="${filter === 'all'}">전체 <b>${inMonth.length}</b></button>
        ${PROGRESS.map((p) => `
          <button type="button" class="progress-tab is-${p.key}" data-action="cal-filter" data-filter="${p.key}" aria-pressed="${filter === p.key}">
            <i></i>${p.label} <b>${counts[p.key]}</b>
          </button>`).join('')}
        <span class="progress-hint">이번 달 기준 · 자료 필요일은 상태에 따라 자동 분류, 직접 만든 일정은 아래에서 바꿀 수 있어요</span>
      </div>

      <div class="cal-grid-wrap">
        <div class="cal-grid">
          <div class="cal-dow">${DOW.map((d, i) => `<div class="${i === 0 || i === 6 ? 'is-weekend' : ''}">${d}</div>`).join('')}</div>
          <div class="cal-cells">${cells}</div>
        </div>
        ${dayPanel(state, entries, selected, today, form)}
      </div>
    </div>`;
}

function entryChip(e) {
  const cls = `${e.kind === 'need' ? `is-need risk-${e.risk}` : 'is-event'} p-${e.progress}`;
  return `<span class="cal-chip ${cls}" draggable="true" data-drag-entry="${e.id}" title="${esc(e.title)} · ${progressLabel(e.progress)}">${esc(e.title)}</span>`;
}

// 사용자 일정의 진행 구분 전환
function progressSwitch(e) {
  return `
    <span class="progress-switch" role="group" aria-label="진행 구분">
      ${PROGRESS.map((p) => `<button type="button" data-action="cal-progress" data-event="${e.eventId}" data-progress="${p.key}" aria-pressed="${e.progress === p.key}">${p.label}</button>`).join('')}
    </span>`;
}

// 오른쪽: 선택한 날의 일정 목록 + 일정 추가
function dayPanel(state, entries, selected, today, form) {
  const list = entriesOn(entries, selected);
  const rows = list.map((e) => {
    const detail = e.kind === 'need'
      ? `<span class="status status-${e.status}">${ICON[e.status]}${STATUS_LABEL[e.status]}</span>
         <span>${esc(e.sub)}${e.status !== 'done' ? ` · ${leftText(e.left)}` : ''}</span>`
      : `<span class="cal-tag">일정</span><span>${esc(e.sub || '')}</span>`;
    const progress = e.kind === 'event'
      ? progressSwitch(e)
      : `<span class="progress-pill is-${e.progress}"><i></i>${progressLabel(e.progress)}</span>`;
    const link = e.kind === 'need' && e.status !== 'done'
      ? `<a class="link" href="${e.status === 'fix' ? `#/fix/${e.itemId}` : e.status === 'follow' ? `#/follow/${e.itemId}` : `#/compose/${e.itemId}`}">열기</a>` : '';
    const remove = e.kind === 'event'
      ? `<button type="button" class="link cal-remove" data-action="cal-remove-event" data-event="${e.eventId}">삭제</button>` : '';
    return `
      <div class="cal-item ${e.kind === 'need' ? `is-need risk-${e.risk}` : 'is-event'} p-${e.progress}" draggable="true" data-drag-entry="${e.id}">
        <div class="cal-item-main">
          <b>${esc(e.title)}</b>
          <div class="cal-item-meta">${detail}</div>
          <div class="cal-item-progress">${progress}</div>
        </div>
        <div class="cal-item-actions">
          ${link}${remove}
          <label class="cal-move">날짜<input type="date" value="${e.date}" data-action-change="cal-move" data-entry="${e.id}"></label>
        </div>
      </div>`;
  }).join('');

  return `
    <aside class="cal-panel" data-drop="${selected}">
      <div class="cal-panel-head">
        <h2>${formatMDW(selected)}${selected === today ? ' <span>· 오늘</span>' : ''}</h2>
        <span class="cal-count">${list.length ? `${list.length}건` : '일정 없음'}</span>
      </div>
      <div class="cal-items">${rows || '<div class="cal-empty">이 날에는 일정이 없어요. 아래에서 추가하거나 달력 항목을 끌어다 놓으세요.</div>'}</div>
      <form class="cal-add" data-action-submit="cal-add-event" novalidate>
        <label class="f ${form.errors?.title ? 'has-error' : ''}">
          <span class="f-label">일정 추가 <small>${formatMD(selected)}</small></span>
          <input type="text" name="title" value="${esc(form.title || '')}" placeholder="예: 재고실사 결과 검토 시작" autocomplete="off">
          ${form.errors?.title ? `<span class="f-error">${esc(form.errors.title)}</span>` : ''}
        </label>
        <button type="submit" class="btn btn-cta">추가</button>
      </form>
    </aside>`;
}

/** 메일 본문의 값 칩. 일정 후보와 맞으면 끌어서 캘린더에 넣을 수 있게 표시한다. */
function mailField(text, dates) {
  const d = dates ? matchMailDate(text, dates) : null;
  if (!d) return `<span class="m-field">${esc(text)}</span>`;
  return `<span class="m-field is-draggable" draggable="true" data-drag-date="${d.key}" data-date="${d.date}" data-title="${esc(d.title)}" data-item="${esc(d.itemId)}" title="끌어서 캘린더에 추가">${esc(text)}</span>`;
}

/**
 * 메일 패널 하단 '캘린더에 추가' 영역: 메일에 나오는 날짜 칩 + 드롭 영역.
 * dates: mailDates() 결과, existing: 이미 추가된 일정(event) 목록
 */
function mailDateDock(dates, state) {
  const events = state.events || [];
  const chips = dates.map((d) => {
    const added = events.some((e) => e.title === d.title && e.date === d.date && (e.itemId || null) === d.itemId);
    return `
      <span class="dock-chip ${added ? 'is-added' : ''}" draggable="${added ? 'false' : 'true'}"
            data-drag-date="${d.key}" data-date="${d.date}" data-title="${esc(d.title)}" data-item="${esc(d.itemId)}">
        ${ICON.clock}${d.label}
        ${added ? `<i>${ICON.done}</i>` : `<button type="button" class="dock-add" data-action="add-mail-date" data-key="${d.key}" aria-label="${esc(d.title)} 일정으로 추가">+</button>`}
      </span>`;
  }).join('');
  return `
    <div class="cal-dock" data-drop="dock">
      <div class="dock-head"><b>캘린더에 추가</b><small>날짜 칩을 여기로 끌어오거나 + 를 누르세요</small></div>
      <div class="dock-chips">${chips}</div>
      <a class="link" href="#/calendar">일정 탭 열기</a>
    </div>`;
}

return { renderCalendar, mailField, mailDateDock };
})();

const { formatMD, formatMDW } = __m_lib_dates;

/**

function renderCompose(state, { today, clock, itemId, tone, copied, toast }) {
  const item = withDays(state.items.find((x) => x.id === itemId), today);
  const person = state.people[item.owner] || {};
  const history = item.nudges || [];
  const last = history[history.length - 1];
  const recommended = recommendTone(item);
  const mail = signMail(buildMail({ item, person, client: state.client, manager: state.team?.manager, today, tone }), currentUser(state));
  const timing = sendTiming(clock, item.neededOn);
  const dates = mailDates([item], today);

  const footNote = copied && last
    ? `${ICON.done}독촉 이력에 기록했어요 · ${formatMD(last.on)} ${toneName(last.tone)} 단계로 복사`
    : '복사하면 독촉 이력에 자동으로 기록돼요. 발송은 아웃룩에서 해주세요.';

  return `
    <div class="drawer-dim" data-action="close-compose"></div>
    <aside class="drawer compose" role="dialog" aria-modal="true" aria-labelledby="compose-title">
      <header class="m-header mobile-only">
        <button type="button" class="icon-btn" data-action="close-compose" aria-label="뒤로">${ICON.back}</button>
        <div class="m-header-title">독촉 메일</div>
        ${timingChip(timing)}
      </header>

      <div class="drawer-body">
        <div class="compose-head">
          <div class="compose-who">
            <div class="eyebrow desktop-only">단건 독촉 ${timingChip(timing)}</div>
            <h2 id="compose-title">${esc(item.name)}</h2>
            <div class="compose-owner desktop-only">${esc(item.owner)}${person.dept ? ` · ${esc(person.dept)}` : ''}</div>
          </div>
          <button type="button" class="icon-btn btn-sub desktop-only" data-action="close-compose" aria-label="닫기">${ICON.close}</button>
        </div>

        ${timingBanner(timing)}
        ${facts(item, history, last, state)}
        ${mobileChips(item, history, last)}
        ${toneSlider(tone, recommended, item)}
        ${preview(mail, dates)}
        ${item.kind === 'confirmation' ? followEntry(item) : templateNote(item)}
        ${mailDateDock(dates, state)}
      </div>

      <footer class="compose-foot">
        <div class="foot-note ${copied ? 'is-done' : ''}">${footNote}</div>
        <div class="foot-actions">
          <button type="button" class="btn btn-ghost" data-action="open-status" data-item="${esc(item.id)}">${ICON.fix}자료 상태 변경</button>
          <button type="button" class="btn btn-cta copy-btn" data-action="copy-mail">${ICON.copy}<span>복사하기</span></button>
        </div>
      </footer>

      ${toast ? `
        <div class="compose-toast" role="status">
          <span class="toast-check">${ICON.done}</span>
          <span><b>메일을 복사했어요. 아웃룩에 붙여넣으세요.</b>
            <small>독촉 이력에 기록했어요<span class="desktop-only"> · 발송은 아웃룩에서 직접 해주세요</span></small></span>
        </div>` : ''}
    </aside>`;
}

// 표준 양식으로 요청한 자료: 독촉하면서 양식을 다시 보낼 수 있게
function templateNote(item) {
  const t = templateOf(item);
  if (!t) return '';
  return `
    <section class="tpl-note">
      <div class="section-label">요청 양식 <small class="fu-count">${item.basisDate ? `${formatMD(item.basisDate)} 기준 · ` : ''}${t.columns.length}개 항목${t.sign ? ' · 서명 필요' : ''}</small></div>
      <div class="tpl-cols">${t.columns.map((c) => `<i>${esc(c)}</i>`).join('')}</div>
      <button type="button" class="btn btn-sub tpl-copy" data-action="copy-template" data-item="${esc(item.id)}">${ICON.copy}엑셀용 요청 양식 다시 복사</button>
    </section>`;
}

// 외부조회 건: 독촉을 마치고도 회신이 없거나, 회신 금액이 다르면 후속 절차로 넘어간다.
function followEntry(item) {
  return `
    <section class="follow-entry">
      <div class="section-label">회신 결과가 나왔나요?</div>
      <div class="follow-entry-btns">
        <button type="button" class="btn btn-sub" data-action="start-follow" data-type="noreply" data-item="${esc(item.id)}">
          ${ICON.follow}<span><b>미회수로 확정</b><small>대체적 절차 가이드로</small></span></button>
        <button type="button" class="btn btn-sub" data-action="start-follow" data-type="diff" data-item="${esc(item.id)}">

      </div>
    </section>`;
}

// 데스크톱 상단 4칸: 필요일 / 남은 날 / 요청 후 / 독촉 이력
function facts(item, history, last, state) {
  const leftValue = item.left === 0 ? '오늘' : item.left > 0 ? `${item.left}일` : `${-item.left}일 지남`;
  return `
    <div class="facts desktop-only">
      <div class="fact">
        <div class="fact-label">필요일</div>
        <div class="fact-value">${formatMDW(item.neededOn)}</div>
        <div class="fact-sub">${esc(item.procedure || termsOf(state.client.service).defaultProcedure)} 절차 시작</div>
      </div>
      <div class="fact fact-risk risk-${item.risk}">
        <div class="fact-label">남은 날</div>
        <div class="fact-value">${leftValue}</div>
        <div class="fact-sub">${ICON[item.risk]}${RISK_LABEL[item.risk]}</div>
      </div>
      <div class="fact">
        <div class="fact-label">요청 후</div>
        <div class="fact-value">D+${item.elapsed}</div>

      <div class="fact">
        <div class="fact-label">독촉 이력</div>

  return `

}

          <dt>참조</dt><dd>${cc}</dd>

function requesterField(state, form) {

// 필요일을 고르면 남은 날과 위험도를 미리 보여준다.
function needPreview(neededOn, today) {
  const iso = normalizeDate(neededOn, today);
  if (!iso) {
    return `<div class="need-preview is-empty"><span>필요일을 고르면 남은 날과 위험도를 미리 보여드려요.</span></div>`;
  }
  const left = daysBetween(today, iso);
  const risk = riskOf(left);
  return `
    <div class="need-preview">
      <div><small>필요일</small><b>${formatMDW(iso)} <span>· ${leftText(left)}</span></b></div>

    </div>`;
}

function pasteForm(state, today, pasteText, parsed) {
  return `
    <div class="add-paste">

        <span class="f-label">엑셀에서 복사한 행을 붙여넣으세요

      </label>
      <div class="paste-preview">${pastePreview(parsed, today)}</div>
      <div class="need-note">담당자는 기존 목록과 이름이 같으면 자동으로 묶여요 · 모두 ‘미회신’으로 시작해요</div>
    </div>`;
}

/** textarea 입력 중에 미리보기만 다시 그릴 때도 쓴다. */
function pastePreview(parsed, today) {
  const { rows, headerSkipped, errorCount } = parsed;
  if (!rows.length) {
    return `<div class="pp-empty">붙여넣은 내용이 없어요. 엑셀에서 행을 복사해 위에 붙여넣어 주세요.</div>`;
  }
  const summary = `${rows.length}건 인식${errorCount ? ` · <b class="pp-warn">${errorCount}건 확인 필요</b>` : ''}`;
  const sorted = [...rows].sort((a, b) => {
    if (!a.value || !b.value) return (a.value ? 1 : 0) - (b.value ? 1 : 0);
    return leftOf(a.value, today) - leftOf(b.value, today);
  });
  const body = sorted.map((r) => {
    if (!r.value) {
      return `
        <div class="pp-row is-error">
          <div class="pp-name">${esc(r.cells[0] || '(자료명 없음)')}</div>
          <div class="pp-owner">${esc(r.cells[1] || '')}</div>
          <div class="pp-date">${esc(r.cells[2] || '')}</div>
          <div class="pp-date">${esc(r.cells[3] || '')}</div>
          <div class="pp-left"><span class="pp-err">${ICON.high}${rowErrorText(r.errors)}</span></div>
        </div>`;
    }
    const left = leftOf(r.value, today);
    const risk = riskOf(left);
    return `
      <div class="pp-row">
        <div class="pp-name">${esc(r.value.item.name)}${r.value.item.procedure ? `<small>${esc(r.value.item.procedure)}</small>` : ''}</div>
        <div class="pp-owner">${esc(r.value.item.owner)}</div>
        <div class="pp-date">${formatMD(r.value.item.requestedOn)}</div>
        <div class="pp-date">${formatMD(r.value.item.neededOn)}</div>
        <div class="pp-left"><b>${leftText(left)}</b><span class="risk risk-${risk}">${ICON[risk]}${RISK_LABEL[risk]}</span></div>
      </div>`;
  }).join('');

  return `
    <div class="pp-summary">${summary}${headerSkipped ? ' <span>· 첫 줄은 제목으로 보고 뺐어요</span>' : ''}<span class="desktop-only"> · 필요일이 가까운 순</span></div>
    <div class="pp-table">
      <div class="pp-row pp-head"><div>자료명</div><div>담당자</div><div>요청일</div><div>필요일</div><div>남은 날</div></div>
      ${body}
    </div>`;
}

function pasteSubmit(parsed) {
  const ok = parsed.rows.length > 0 && parsed.errorCount === 0;
  return `<button type="button" class="btn btn-cta" data-action="add-paste" ${ok ? '' : 'disabled'}>${parsed.rows.length ? `${parsed.rows.length}건 추가하기` : '추가하기'}</button>`;
}

return { PASTE_EXAMPLE, renderAdd, pastePreview, pasteSubmit };
})();

          <span>원</span>

      </div>
      ${materiality?.basis ? `<p class="co-basis">${esc(materiality.basis)}${materiality.overall ? ` · 전체 중요성 ${eok(materiality.overall)}` : ''}</p>` : ''}

      <div class="co-grid">

          <div class="co-bar" role="img" aria-label="회신 확인 ${pct(c.confirmed)}%, 대체적 절차 ${pct(c.alternative)}%, 미확인 ${pct(c.uncovered)}%">

          </div>

const __m_views_status = (() => {
const { formatMD } = __m_lib_dates;

/**
 * @param item  상태를 바꿀 자료
 * @param sheet { status, reason, basisDate, requiredBasisDate, errors }
 * @param today 기준일 (수령일로 기록될 날짜)
 */
function renderStatusSheet(item, { status, reason, basisDate, requiredBasisDate, errors, check }, today) {
  const options = allowedStatuses(item).map((s) => `
    <button type="button" class="status-opt" data-action="pick-status" data-status="${s}" aria-pressed="${status === s}">

  const receivedNote = item.received?.on
    ? `수령일은 처음 받은 ${formatMD(item.received.on)} 그대로예요.`
    : `수령일이 ${formatMD(today)}로 기록돼요.`;
  const note = status
    ? `${receivedNote} 독촉 횟수와 이력은 바뀌지 않아요.`
    : '바꿀 상태를 골라 주세요. 미회신으로 되돌리는 건 지원하지 않아요.';

  return `
    <div class="sheet-dim" data-action="close-status"></div>

      <div class="sheet-head">

          <div class="eyebrow">자료 상태 변경</div>
          <h3 id="status-title">${esc(item.name)}</h3>
          <div class="sheet-current">지금 <span class="status status-${item.status}">${ICON[item.status]}${STATUS_LABEL[item.status]}</span></div>
        </div>
        <button type="button" class="icon-btn btn-sub" data-action="close-status" aria-label="닫기">${ICON.close}</button>
      </div>

      <div class="sheet-body">
        ${receiptCheck(item, check, today)}
        <div class="status-opts">${options}</div>
        ${errors.status ? `<div class="f-error">${esc(errors.status)}</div>` : ''}
        ${status === 'fix' ? fixFields(reason, basisDate, requiredBasisDate, errors) : ''}
        <div class="sheet-note">${note}</div>
      </div>

      <footer class="sheet-foot">
        <button type="button" class="btn btn-sub" data-action="close-status">취소</button>
        <button type="button" class="btn btn-cta" data-action="save-status" ${status ? '' : 'disabled'}>${saveLabel(status)}</button>
      </footer>
    </div>`;

// 표준 양식으로 요청한 자료: 받은 자료를 양식 기준으로 점검하면 상태와 보완 사유를 추천한다.
function receiptCheck(item, check, today) {
  const t = templateOf(item);
  if (!t || !check) return '';
  const basis = item.basisDate || `${today.slice(0, 4)}-12-31`;
  const s = receiptSuggestion(t, check, basis);
  const yesNo = (action, value, yes, no) => `
    <span class="rc-yn">
      <button type="button" data-action="${action}" data-ok="1" aria-pressed="${value === true}">${yes}</button>
      <button type="button" data-action="${action}" data-ok="0" aria-pressed="${value === false}">${no}</button>
    </span>`;
  return `
    <section class="receipt-check">
      <div class="f-label">받은 자료 점검 <small>${esc(t.name)} 표준 양식 기준</small></div>
      <div class="rc-row"><span>기준일이 <b>${basis.replaceAll('-', '.')}</b>인가요?</span>${yesNo('check-basis', check.basisOk, '맞아요', '달라요')}</div>
      <div class="rc-row rc-cols"><span>빠진 항목을 눌러 표시해 주세요</span>
        <div class="tpl-cols">${t.columns.map((c) => `<button type="button" data-action="check-col" data-col="${esc(c)}" aria-pressed="${check.missing.includes(c)}">${esc(c)}</button>`).join('')}</div>
      </div>
      ${t.sign ? `<div class="rc-row"><span>${esc(t.sign)}에 서명이 있나요?</span>${yesNo('check-sign', check.signOk, '있어요', '없어요')}</div>` : ''}
      <div class="rc-result ${s.status === 'fix' ? 'is-fix' : s.status === 'done' ? 'is-done' : ''}">${esc(s.summary)}</div>
    </section>`;
}

function saveLabel(status) {
  if (status === 'done') return '완료로 처리';
  if (status === 'fix') return '보완 요청으로 저장';
  if (status === 'part') return '일부 수령으로 저장';
  return '저장';
}

// 보완 요청을 고르면 사유를, 기준일 상이면 두 기준일까지 같이 받는다.

  const dates = reason === 'date' ? `

      <label class="f ${errors.requiredBasisDate ? 'has-error' : ''}">
        <span class="f-label">필요한 기준일</span>
        <input type="date" name="requiredBasisDate" value="${esc(requiredBasisDate || '')}">
        ${errors.requiredBasisDate ? `<span class="f-error">${esc(errors.requiredBasisDate)}</span>` : ''}
      </label>
    </div>` : '';

  return `
    <div class="sheet-fix">
      <div class="f-label">무엇을 다시 받아야 하나요?</div>
      <div class="reason-grid" role="group" aria-label="보완 사유">${reasons}</div>
      ${errors.reason ? `<div class="f-error">${esc(errors.reason)}</div>` : ''}

}

return { renderStatusSheet };
})();

                <input type="checkbox" data-action-change="conf-bank-blank" ${bankBlank ? 'checked' : ''}>
                장부금액을 적지 않고 보내기 (공란형) <small>금융기관이 직접 금액을 기재해요</small>

          </div>

          <div class="report-block">
            <h2>선정된 ${t.unit} 목록 <span>· 엑셀에서 복사해 붙여넣기</span></h2>
            <label class="f">
              <span class="f-label">열 순서: ${t.columns.join(' · ')}
                <small>첫 줄이 제목이면 자동으로 빼요${type === 'arap' ? '' : ` · 같은 ${t.unit}의 여러 행은 한 장으로 묶어요`}</small></span>

              <button type="button" class="btn btn-sub" data-action="conf-example">예시 데이터 넣기</button>

            <div class="conf-preview">${partiesPreview(type, parseConfirmations(type, pasteText))}</div>
          </div>

          <div class="conf-output">${outputSection(state, { today, type, setup, pasteText, bankBlank })}</div>
        </section>
      </div>
    </div>`;
}

// ---------- 공통 정보 ----------

function field(label, name, value, { type = 'text', placeholder = '', error = '', hint = '' } = {}) {
  return `
    <label class="f ${error ? 'has-error' : ''}">
      <span class="f-label">${label}${hint ? ` <small>${hint}</small>` : ''}</span>
      <input type="${type}" name="${name}" value="${esc(value ?? '')}" placeholder="${esc(placeholder)}" autocomplete="off">
      ${error ? `<span class="f-error">${esc(error)}</span>` : ''}
    </label>`;
}

function contactField(s, e, members) {

// ---------- 붙여넣기 미리보기 ----------

const ERR_ORDER = ['name', 'address', 'category', 'amount', 'form', 'duplicate'];
const errText = (errors) => ERR_ORDER.filter((k) => errors[k]).map((k) => errors[k]).join(' · ');

/** textarea 입력 중에 미리보기만 다시 그릴 때도 쓴다. */
function partiesPreview(type, parsed) {
  const { rows, parties, headerSkipped, errorCount } = parsed;
  if (!rows.length) {
    return `<div class="pp-empty">붙여넣은 내용이 없어요. 표본 선정이 끝난 ${CONF_TYPES[type].unit} 목록을 붙여넣어 주세요.</div>`;
  }
  const badRows = rows.filter((r) => Object.keys(r.errors).length);
  const summary = `${rows.length}행 → 조회서 <b>${parties.length}장</b>${errorCount ? ` · <b class="pp-warn">${errorCount}건 확인 필요</b>` : ''}`;

  const rowErrors = badRows.length ? `
    <div class="conf-row-errors">
      ${badRows.map((r) => `<div><span class="pp-err">${ICON.high}${r.line}행</span> ${esc(r.cells[0] || '(이름 없음)')} — ${esc(errText(r.errors))}</div>`).join('')}
    </div>` : '';

  return `
    <div class="pp-summary">${summary}${headerSkipped ? ' <span>· 첫 줄은 제목으로 보고 뺐어요</span>' : ''}</div>
    ${rowErrors}
    <div class="pp-table conf-table">
      <div class="pp-row pp-head"><div>${CONF_TYPES[type].unit}</div><div>주소</div><div>조회 내용</div><div>행</div></div>
      ${parties.map((p) => partyRow(type, p)).join('')}
    </div>`;
}

function partyRow(type, p) {
  const bad = Object.keys(p.errors).length;
  let content;
  if (type === 'bank') {
    const total = p.entries.reduce((s, e) => s + (e.bookAmount || 0), 0);
    content = `${p.entries.map((e) => esc(e.category)).join(' · ')}<small>${p.entries.length}개 항목 · 장부 ${formatAmount(total)}원</small>`;
  } else if (type === 'inventory') {
    const total = p.goods.reduce((s, g) => s + (g.bookAmount || 0), 0);
    content = `${p.goods.map((g) => esc(g.item)).join(' · ')}<small>${p.goods.length}개 품목${total ? ` · 장부 ${formatAmount(total)}원` : ''}</small>`;
  } else if (type === 'arap') {
    content = `채권 ${formatAmount(p.receivable)} · 채무 ${formatAmount(p.payable)}<small>${p.blank ? '공란형 (금액 미기재)' : '금액 기재형'}</small>`;
  } else {
    content = p.matters.length ? `${p.matters.length}건<small>${esc(p.matters[0])}${p.matters.length > 1 ? ' 외' : ''}</small>` : '사건 미기재<small>전체 조회</small>';
  }
  const name = (type === 'bank' || type === 'inventory') && p.branch ? `${p.name} ${p.branch}` : p.name;
  return `
    <div class="pp-row ${bad ? 'is-error' : ''}">
      <div class="pp-name">${esc(name)}${type === 'legal' && p.lawyer ? `<small>${esc(p.lawyer)}</small>` : ''}</div>
      <div class="conf-addr">${bad && p.errors.address ? `<span class="pp-err">${ICON.high}${esc(p.errors.address)}</span>` : esc(p.address)}${p.errors.duplicate ? `<span class="pp-err">${ICON.high}${esc(p.errors.duplicate)}</span>` : ''}</div>
      <div class="conf-content">${content}</div>
      <div class="pp-date">${p.lines.join(', ')}</div>
    </div>`;
}

// ---------- 결과: 조회서 미리보기 + 등록 ----------

/** 입력이 바뀔 때 이 영역만 다시 그린다. */
function outputSection(state, { today, type, setup, pasteText, bankBlank }) {
  const parsed = parseConfirmations(type, pasteText);
  const { errors, value } = validateSetup(setup, today);
  const missing = [];
  if (!value) missing.push(`공통 정보 ${Object.keys(errors).length}곳`);
  if (!parsed.parties.length) missing.push(`${CONF_TYPES[type].unit} 목록`);
  else if (parsed.errorCount) missing.push(`목록 오류 ${parsed.errorCount}건`);

  if (missing.length) {
    return `
      <div class="report-block conf-wait">
        <h2>조회서 미리보기</h2>
        <p>${missing.join(' · ')}을(를) 확인하면 조회서가 여기에 만들어져요.</p>
      </div>`;
  }

  const letters = buildLetters(type, parsed.parties, value, { startNo: nextDocNo(state.items, type), bankBlank });
  return `
    <div class="report-block">
      <div class="conf-out-head">
        <h2>조회서 미리보기 <span>· ${letters.length}장 · ${letters[0].docNo}${letters.length > 1 ? ` ~ ${letters.at(-1).docNo}` : ''}</span></h2>
        <div class="report-actions">
          <button type="button" class="btn btn-sub" data-action="conf-print">${ICON.download}인쇄 · PDF 저장</button>
          <button type="button" class="btn btn-cta" data-action="conf-register">조회 목록에 ${letters.length}건 등록</button>
        </div>
      </div>
      <p class="need-note">등록하면 대시보드에서 ${CONF_TYPES[type].unit}별로 회신을 추적하고 독촉 메일을 만들 수 있어요. ${{ required: '금액과 상관없이 전부 회수해야 하는 조회서예요.', coverage: '수행중요성 대비 금액 커버리지로 관리하는 조회서예요.', general: '회신 여부와 내용으로 관리하는 조회서예요.' }[CONF_TYPES[type].track]}</p>
    </div>
    <div class="letters">${letters.map(letterHtml).join('')}</div>`;
}

function tableHtml(table) {
  if (!table) return '';
  const amount = new Set(table.amountCols);
  return `
    ${table.caption ? `<div class="lt-caption">${esc(table.caption)}</div>` : ''}
    <table class="lt-table">
      <thead><tr>${table.columns.map((c, i) => `<th class="${amount.has(i) ? 'is-amt' : ''}">${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${table.rows.map((r) => `<tr>${r.map((c, i) => `<td class="${amount.has(i) ? 'is-amt' : ''}">${esc(c) || '&nbsp;'}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>`;
}

/** 조회서 한 장 (A4). 인쇄할 때는 이 부분만 나간다. */
function letterHtml(l) {
  return `
    <article class="letter">
      <div class="lt-meta"><span>문서번호 ${esc(l.docNo)}</span><span>${esc(l.issuedOn)}</span></div>
      <h3 class="lt-title">${esc(l.title)}</h3>
      ${l.blank ? '<div class="lt-badge">금액 미기재 (공란형)</div>' : ''}

      <dl class="lt-addr">
        <div><dt>수신</dt><dd><b>${esc(l.to.name)}</b> 귀중${l.to.attn ? ` (${esc(l.to.attn)})` : ''}<br><small>${esc(l.to.address)}</small></dd></div>
        <div><dt>발신</dt><dd><b>${esc(l.from.company)}</b> 대표이사 ${esc(l.from.ceo)}<br><small>${esc(l.from.address)}</small></dd></div>
      </dl>

      ${l.paragraphs.map((p) => `<p class="lt-p">${esc(p)}</p>`).join('')}
      ${tableHtml(l.table)}
      ${l.requests ? `<ol class="lt-requests">${l.requests.map((r) => `<li>${esc(r)}</li>`).join('')}</ol>` : ''}
      <ul class="lt-notes">${l.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>

      <div class="lt-sign">
        <span>${esc(l.from.company)}</span>
        <span>대표이사 ${esc(l.from.ceo)} <span class="lt-seal">(인)</span></span>
      </div>

      <div class="lt-reply-to">
        <b>회신처 · ${esc(l.replyBy)}까지</b>
        <span>${esc(l.replyTo.auditor)} · ${esc(l.replyTo.address)}</span>
        <span>담당 ${esc(l.replyTo.contact)}${l.replyTo.phone ? ` · ${esc(l.replyTo.phone)}` : ''}${l.replyTo.email ? ` · ${esc(l.replyTo.email)}` : ''}</span>
      </div>

      <div class="lt-cut">절 취 선 · 아래는 조회처에서 작성하여 회신처로 직접 보내 주세요</div>
      <div class="lt-reply">
        <b>${esc(l.reply.heading)}</b>
        ${l.reply.statements.map((s) => `<div class="lt-check"><span class="lt-box"></span>${esc(s)}</div>`).join('')}
        <div class="lt-signline"><span>${esc(l.reply.signer)}</span><span>(서명 또는 인)</span></div>
        <div class="lt-signline"><span>회신일</span><span>년 &nbsp;&nbsp; 월 &nbsp;&nbsp; 일</span></div>
      </div>
    </article>`;
}

return { renderConfirm, partiesPreview, outputSection, letterHtml };
})();

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // clipboard API가 막힌 환경용 대체 방법
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

// 예시 자료의 첨부 파일을 브라우저 저장소에 만든다 (주간 보고 '첨부자료' 칸에서 열어 볼 수 있게).
// 내용은 예시 안내 문구뿐이다. 저장소가 막힌 환경이면 조용히 넘어간다.
// 예시 첨부: 스캔본처럼 그린 문서 이미지. 그리기에 실패하면 짧은 안내 텍스트로 대신한다.
async function sampleFileBlob(f, item) {
  const setup = { ...(state.confirmSetup || {}), contactName: item.requester || state.confirmSetup?.contactName || '' };
  const doc = sampleDoc(f.id, item, setup);
  if (doc) {
    try { return await renderScan(doc, f.id.length * 31 + item.id.charCodeAt(1)); } catch { /* 아래 텍스트로 */ }
  }
  const text = `${f.name}\n\nPBC Mate 시연용 예시 첨부파일입니다. 실제 자료가 아닙니다.\n자료: ${item.name}\n담당: ${item.owner}\n`;
  return new Blob([text], { type: 'text/plain' });
}

async function seedSampleFiles() {
  for (const f of SAMPLE_FILES) {
    const item = state.items.find((x) => x.id === f.itemId);
    if (!item) continue;
    try { await putFile(f.id, await sampleFileBlob(f, item)); } catch { return; }
  }
}

function attachOverlay() {
  if (preview) return renderPreview(preview);
  const item = att && state?.items.find((x) => x.id === att.itemId);
  if (!item) { att = null; return ''; }
  return renderAttach(item, att);
}

function closePreview() {
  if (preview?.url) URL.revokeObjectURL(preview.url);
  preview = null;
  render();
}

function openAttach(itemId, justDone) {
  att = { itemId, pending: [], rejected: [], justDone, saving: false };
  render();
}

function pickFiles(fileList) {
  const item = state.items.find((x) => x.id === att.itemId);
  const { ok, rejected } = checkFiles([...att.pending, ...fileList], item.attachments || []);
  att.pending = ok;
  att.rejected = rejected;
  render();
}

// 외부조회서: 손댄 칸의 오류만 보여준다 (처음 열었을 때 빨간 칸이 가득하지 않게)
function confSetupErrors(today) {
  const { errors } = validateSetup(conf.setup, today);
  return Object.fromEntries(Object.entries(errors).filter(([k]) => conf.touched.has(k)));
}

function readConfSetup() {
  const form = document.getElementById('conf-setup');
  if (!form || !conf) return;
  for (const el of form.elements) if (el.name) conf.setup[el.name] = el.value;
}

// 붙여넣기·공통 정보가 바뀌면 미리보기와 조회서 영역만 다시 그린다 (입력 포커스 유지)
function refreshConfOutput() {
  const today = currentToday();
  app.querySelector('.conf-preview').innerHTML = partiesPreview(conf.type, parseConfirmations(conf.type, conf.pasteText));
  app.querySelector('.conf-output').innerHTML = outputSection(state, { today, ...conf });
}

// 증빙을 요청할 회사 담당자 기본값: PBC 자료를 가장 많이 맡은 사람
function defaultPbcOwner() {
  const counts = new Map();
  for (const x of state.items) if (x.kind !== 'confirmation') counts.set(x.owner, (counts.get(x.owner) || 0) + 1);
  return [...counts].sort((a, b) => b[1] - a[1])[0]?.[0] || '';
}

/** '1,250,000' · '-3,000' · '' → 정수 / null */
function numOf(value) {
  const t = String(value ?? '').replace(/[,\s원₩]/g, '');
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) ? Math.round(n) : null;
}

function setItem(id, fn) {
  state = { ...state, items: state.items.map((x) => (x.id === id ? fn(x) : x)) };
  save(state);
}

function setFollow(fn) {
  setItem(fu.itemId, (x) => ({ ...x, follow: fn(x.follow, x) }));
}
